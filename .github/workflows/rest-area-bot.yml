name: 고속도로 휴게소 뉴스 봇

on:
  schedule:
    # GitHub Actions cron은 UTC, 실제 실행은 최대 10~15분 지연될 수 있음
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: rest-area-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # sent_links.json 커밋용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          HISTORY_FILE:        sent_links.json
        run: python rest_area_bot.py

      - name: Persist history
        run: |
          if [[ -n "$(git status --porcelain sent_links.json)" ]]; then
            git config user.name  "rest-area-bot"
            git config user.email "bot@users.noreply.github.com"
            git add sent_links.json
            git commit -m "chore: update sent_links history [skip ci]"
            git push
          else
            echo "변경사항 없음"
          fi
